<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mason 的个人主页。前端开发，关注 Web 和 AI 工具。">
  <title>Mason · 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f6f3e9;
      --ink: #182a22;
      --muted: #496055;
      --accent: #a13b24;
      --line: #c9cec3;
      font-family: Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      align-items: center;
      min-block-size: 100vh;
      min-block-size: 100svh;
      margin: 0;
      padding: clamp(1.5rem, 7vw, 6rem);
      background: var(--background);
      color: var(--ink);
    }

    main {
      inline-size: 100%;
      max-inline-size: 60rem;
      margin-inline: auto;
      padding-block: clamp(2rem, 6vw, 4rem);
      border-block: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font: 400 clamp(4.125rem, 12vw, 10rem) / 0.95 "Instrument Serif", Georgia, serif;
      letter-spacing: -0.065em;
    }

    h1 span {
      color: var(--accent);
    }

    p {
      max-inline-size: 28rem;
      margin: 1.625rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.1875rem);
      line-height: 1.75;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      min-block-size: 44px;
      margin-block-start: 1.75rem;
      padding: 0.55rem 1rem;
      border: 1px solid currentColor;
      border-radius: 0.25rem;
      color: var(--ink);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      background: var(--ink);
      color: var(--background);
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: #17241e;
        --ink: #f2efe4;
        --muted: #cad3c8;
        --accent: #f2a38b;
        --line: #526359;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Mason<span aria-hidden="true">.</span></h1>
    <p>前端开发者，喜欢做简洁好用的网页，也在探索 AI 工具如何融入日常开发。</p>
    <a href="https://github.com/silentcloud">GitHub <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
